app:
  name: "ITMO Calendar"
  env: "production"
  version: "1.0.0"
  owner: "n.belyakov"

http_server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: "10s"
  write_timeout: "30s"
  idle_timeout: "120s"
  enable_http2: true
  pprof_enabled: false
  rate_limit_rpm: 100

postgres:
  connection:
    hosts: "postgres:5432"
    username: "itmo_calendar"
    password: "${POSTGRES_PASSWORD}"
    database: "itmo_calendar"
    additional: "sslmode=disable"
  pool:
    max_connections: 25
    min_connections: 5
    max_connection_lifetime: "1h"
    max_connection_idle_time: "10m"
    health_check_period: "30s"

rabbitmq:
  host: "rabbitmq"
  port: 5672
  user: "itmo_calendar"
  password: "${RABBITMQ_PASSWORD}"
  vhost: "/"
  queues:
    cron_process_schedule: "cron_process_schedule"
    send_schedule: "send_schedule"

itmo:
  base_url: "https://my.itmo.ru/api"
  provider_url: "https://id.itmo.ru/auth/realms/itmo"
  redirect_url: "https://my.itmo.ru/login/callback"
  client_id: "student-personal-cabinet"
  insecure_skip_verify: true

secret:
  jwt_secret: "${JWT_SECRET}"

logger:
  level: "info"
  encoding: "json"
  output_paths:
    - "stdout"
  error_output_paths:
    - "stderr"
  development: false
  sampling: true
  stacktrace: "error"

shutdown:
  delay: "5s"
  timeout: "30s"
  callback_timeout: "10s"

cron:
  batch_size: 50
  min_update_interval: 6h
  schedule_preparation_interval: 30m
